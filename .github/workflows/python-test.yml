name: Python application

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Check formatting with ruff
        run: uv run ruff format --check .
      - name: Type-check with pyright
        run: uv run pyright app
      - name: Run tests
        run: uv run pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    # Blocking gate. click was bumped to >= 8.3.3 (PYSEC-2026-2132) via the
    # pyproject constraint-dependencies floor, so the audit runs clean.

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Audit locked runtime dependencies with pip-audit
        # Explicit bash adds -o pipefail: a failed `uv export` must fail the
        # gate, not hand pip-audit an empty stdin that passes vacuously.
        shell: bash
        run: uv export --format requirements-txt --no-dev --no-emit-project | uvx pip-audit -r /dev/stdin --strict

  frontend-test:
    runs-on: ubuntu-latest
    # Blocking gate for the Constellation UI. Without this the frontend is
    # entirely ungated: 25 test files never run, and a change that breaks the
    # build or the types still lands on a green CI.
    #
    # Playwright e2e (`pnpm e2e`) is deliberately absent: it needs browser
    # downloads and a live server, so it belongs in its own job, not the PR gate.

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/ui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend/ui
        run: pnpm install --frozen-lockfile
      - name: Type-check with tsc
        working-directory: frontend/ui
        run: pnpm typecheck
      - name: Lint with eslint
        working-directory: frontend/ui
        run: pnpm lint
      - name: Check formatting with prettier
        working-directory: frontend/ui
        run: pnpm format:check
      - name: Run unit tests with vitest
        working-directory: frontend/ui
        run: pnpm test
      - name: Build the production bundle
        working-directory: frontend/ui
        run: pnpm build

  frontend-e2e:
    runs-on: ubuntu-latest
    # Hard cap. Without this the job inherits GitHub's 360-minute default, so a
    # hung browser or a preview server that never answers would burn six hours of
    # runner time before being killed. A healthy run is well under a minute; the
    # slowest legitimate case is a cold cache re-downloading Chromium.
    timeout-minutes: 10
    # Playwright e2e: smoke, the constellation cut-release flow, and the only
    # accessibility checks anywhere in CI.
    #
    # No backend is involved — `playwright.config.ts` serves a built app through
    # `vite preview` and intercepts the API in-browser with MSW, so the run is
    # deterministic. Live SSE is deliberately not mocked (a service worker cannot
    # do it reliably) and is covered by the hook/reducer unit tests instead; the
    # resulting proxy errors in the log are expected, not failures.
    #
    # The browser is cached on the resolved Playwright version, so the ~150MB
    # Chromium download happens on a version bump rather than every run. The
    # tests themselves take ~18s.

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/ui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend/ui
        run: pnpm install --frozen-lockfile
      - name: Resolve the Playwright version
        id: playwright
        working-directory: frontend/ui
        # Key the browser cache on the exact version, so a Playwright bump
        # invalidates it instead of silently reusing an incompatible browser.
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Download Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend/ui
        run: pnpm e2e:install
      - name: Install Chromium system libraries
        # Always run: the cache restores the browser itself, but its apt
        # dependencies are part of the runner image, not the cached directory.
        working-directory: frontend/ui
        run: pnpm exec playwright install-deps chromium
      - name: Run the Playwright suite
        working-directory: frontend/ui
        run: pnpm e2e

  frontend-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit production dependencies with pnpm
        working-directory: frontend/ui
        env:
          CI: "true"
        run: pnpm audit --prod --audit-level high
